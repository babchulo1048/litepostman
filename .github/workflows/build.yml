# Builds LitePostman installers on GitHub's machines.
# Windows: NSIS .exe installer. Linux: .deb.
# Run it from the GitHub "Actions" tab (Run workflow), or push a tag like v0.1.0.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundle: deb
            files: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: LitePostman-${{ matrix.bundle }}
          path: ${{ matrix.files }}
          if-no-files-found: error
